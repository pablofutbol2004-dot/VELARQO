# Velarqo's legal identity. PECR reg 23 requires every marketing email to
# identify the sender and give a valid opt-out address, so the email footer
# for our own outreach is built from this file.
side: velarqo

legal_name: TODO            # e.g. "Velarqo Ltd"
trading_name: Velarqo
entity_type: TODO           # limited_company | sole_trader | partnership
company_number: TODO        # Companies House number, if a limited company
registered_address: TODO
ico_registration_number: TODO   # data protection fee: required as a controller
privacy_notice_url: TODO        # UK GDPR Art 13/14 notice for prospects

sender:
  name: TODO                # person signing the emails
  role: TODO
  email: TODO               # the Gmail / Outlook mailbox we send from
  reply_to: TODO
  opt_out_instruction: "Reply \"stop\" and I won't contact you again."
