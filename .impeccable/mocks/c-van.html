<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample C · Van livery</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--van:#ffffff;--navy:#0f2a4a;--orange:#ff6b1a;--grey:#d9dde2}
*{box-sizing:border-box}body{margin:0;background:var(--van);font-family:"Work Sans",sans-serif;color:var(--navy)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 28px;border-bottom:1px solid var(--grey)}
.logo{font-family:Anton;font-size:30px;letter-spacing:.02em}.logo span{color:var(--orange)}
.tel{font-weight:700}
.panel{position:relative;padding:60px 28px 80px;overflow:hidden}
.panel:before{content:"";position:absolute;right:-8%;top:0;bottom:0;width:48%;background:var(--navy);transform:skewX(-14deg)}
.panel:after{content:"";position:absolute;right:37%;top:0;bottom:0;width:26px;background:var(--orange);transform:skewX(-14deg)}
.inner{position:relative;z-index:1;max-width:1100px}
h1{font-family:Anton;font-weight:400;text-transform:uppercase;font-size:clamp(48px,8vw,112px);line-height:.95;margin:0;max-width:10ch}
h1 span{color:var(--orange)}
.sub{font-size:20px;line-height:1.45;max-width:40ch;margin:22px 0 28px}
.btn{display:inline-block;background:var(--orange);color:#fff;font-family:Anton;font-size:26px;text-transform:uppercase;padding:14px 28px;text-decoration:none;letter-spacing:.03em}
.chev{position:absolute;left:0;right:0;bottom:0;height:34px;background:repeating-linear-gradient(-45deg,var(--orange) 0 22px,#ffd400 22px 44px)}
.side{position:absolute;right:4%;top:18%;z-index:1;color:#fff;text-align:right;font-family:Anton;text-transform:uppercase;font-size:clamp(20px,2.4vw,34px);line-height:1.3}
.side small{display:block;font-family:"Work Sans";font-size:14px;text-transform:none;opacity:.8;font-weight:600}
@media(max-width:760px){.panel:before{width:30%;right:-18%}.panel:after{right:10%}.side{display:none}}
</style></head><body>
<header><div class="logo">VELAR<span>QO</span></div><div class="tel">hello@velarqo.com</div></header>
<section class="panel"><div class="inner">
<h1>Old quotes <span>into</span> booked jobs</h1>
<p class="sub">Most homeowners you quoted never said no. We follow them up and put the ones still interested back in your diary. Nothing to pay unless it works.</p>
<a class="btn" href="#">Talk to Pablo</a>
</div>
<div class="side">Windows &amp; doors<br>UK-wide<small>Follow-up campaigns on your own quotes</small></div>
<div class="chev"></div></section>
</body></html>
