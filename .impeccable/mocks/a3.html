<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 · Sticker sheet</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&family=Barlow:wght@400;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{--ink:#15213f;--red:#e2342b;--yel:#f4b400;--grn:#2e8b57;--blu:#2459c9;--lam:#fbfaf5}
*{box-sizing:border-box}body{margin:0;font-family:Barlow,sans-serif;color:#fff;background:var(--red)}
.bands{display:grid;grid-template-columns:1.25fr 1fr;min-height:100vh}
.left{background:var(--red);padding:28px 5% 40px;display:flex;flex-direction:column}
.logo{font-family:"Barlow Condensed";font-weight:900;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
h1{font-family:"Barlow Condensed";font-weight:900;text-transform:uppercase;font-size:clamp(54px,8.4vw,132px);line-height:.86;margin:auto 0 22px;letter-spacing:-.01em}
h1 span{color:var(--ink)}
p{font-size:20px;line-height:1.45;max-width:38ch;margin:0 0 26px}
.cta{align-self:flex-start;background:var(--lam);color:var(--ink);text-decoration:none;font-family:"Barlow Condensed";font-weight:800;font-size:24px;text-transform:uppercase;padding:14px 26px;border-radius:50px}
.right{background:var(--lam);color:var(--ink);padding:28px 6%;position:relative}
.sheet{background:#fff;border:1px dashed #b9c0cf;padding:22px;display:grid;grid-template-columns:repeat(5,1fr);gap:14px;box-shadow:0 18px 40px rgba(21,33,63,.18);transform:rotate(2deg);margin-top:40px}
.sheet i{aspect-ratio:1;border-radius:50%;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.sheet i.gone{background:transparent!important;box-shadow:inset 0 0 0 2px #e3e6ee}
.lbl{font-family:"Barlow Condensed";font-weight:800;text-transform:uppercase;font-size:15px;margin-top:26px}
.hand{font-family:"Permanent Marker";font-size:22px;line-height:1.3;margin-top:8px}
.hand em{font-style:normal;color:var(--red)}
.small{position:absolute;bottom:18px;right:24px;font-family:"Barlow Condensed";font-size:12px;text-transform:uppercase;color:#8a93a8}
@media(max-width:760px){.bands{grid-template-columns:1fr}.left{min-height:auto;padding-bottom:36px}h1{margin-top:60px}.sheet{grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}}
</style></head><body>
<div class="bands">
<div class="left"><div class="logo">Velarqo</div>
<h1>Old quotes.<br><span>New</span> jobs.</h1>
<p>Most people you quoted never said no. We follow them up and put the ones still interested back in your diary. You only pay if it works.</p>
<a class="cta" href="#">Talk to Pablo</a></div>
<div class="right">
<div class="lbl">Booked-job stickers · sheet 1</div>
<div class="sheet" id="s"></div>
<div class="hand">Every missing dot = a job <em>back in the diary</em></div>
<div class="small">Illustrative</div>
</div></div>
<script>
const s=document.getElementById('s'),c=['--red','--yel','--grn','--blu'];
for(let i=0;i<30;i++){const e=document.createElement('i');e.style.background=`var(${c[i%4]})`;if([2,7,11,16,19,24].includes(i))e.className='gone';s.appendChild(e)}
</script>
</body></html>
