schema_version: "1"
pack: motion_scene_grammar
kind: motion
title: Motion scene grammar
categories:
  scene_roles:
  - rule: "Declare one role per scene from the fixed set: HOOK, ORIENT, CLAIM, EXPLAIN, COMPARE, PROVE, DEMO, BUILD, REVEAL, TRANSITION, PAYOFF, CTA."
    why: "A declared role stops visually impressive but purposeless scenes."
    source: "MP:04_scene_grammar.md#1"
  - rule: "Refuse to author a scene that has no role; give it a role or cut it."
    why: "Every frame should advance the semantic job."
    source: "MP:04_scene_grammar.md#1"
  - rule: "Map each scene role to a semantic goal expressed as a state change, for example an EXPLAIN scene shows inputs combining into one output."
    why: "Role plus goal makes the scene testable by a quality gate."
    source: "MP:04_scene_grammar.md#2"
  object_model:
  - rule: "Model each scene with typed objects, relations, initial state, motion event, final state, an attention target, and an exit bridge."
    why: "A declarative object model is what a deterministic renderer can execute."
    source: "MP:04_scene_grammar.md#2"
  - rule: "Give every asset a semantic role: evidence, metaphor, anchor, texture, or label."
    why: "If an asset has no role it should be removed."
    source: "MP:04_scene_grammar.md#8"
  - rule: "Keep the scene object set small and purposeful: at most one primary focal object and two to four secondary objects unless the scene intentionally shows scale."
    why: "Object count is a direct proxy for readability."
    source: "MP:04_scene_grammar.md#3"
  - rule: "Record relations between objects (which connects to which, which compares to which) so motion can express them."
    why: "Relationships are the content that motion must render."
    source: "MP:04_scene_grammar.md#2"
  readability:
  - rule: "Never animate every object in a scene at once; foreground motion must dominate background motion."
    why: "Simultaneous animation defeats hierarchy."
    source: "MP:04_scene_grammar.md#3"
  - rule: "Keep text on screen long enough for its complexity; never drop a readable hold to chase cut rhythm."
    why: "Unreadable text is a hard rejection regardless of style."
    source: "MP:04_scene_grammar.md#3"
  - rule: "Place all text and primary objects inside the safe zone and verify no clipping in the rendered frame."
    why: "Clipped or off-safe content fails even a first-pass QC."
    source: "MP:07_quality_control.md#hard"
  - rule: "Give long or complex statements more screen time than short bursts."
    why: "Reading time scales with content density."
    source: "MP:04_scene_grammar.md#3"
  chaining:
  - rule: "Chain scenes through coherent role sequences rather than arbitrary adjacency."
    why: "Sequence is a major part of how a video makes sense."
    source: "MP:04_scene_grammar.md#4"
  - rule: "Use canonical chains per intent: HOOK, ORIENT, EXPLAIN, PROVE, PAYOFF for arguments; HOOK, DEMO, EXPLAIN, DEMO, RESULT for tutorials; PROBLEM, EVIDENCE, DIAGNOSIS, INTERVENTION, RESULT for case studies."
    why: "Known-good sequences reduce planning risk."
    source: "MP:04_scene_grammar.md#4"
  - rule: "Ensure each beat adds meaning and that the payoff resolves what the setup promised."
    why: "A scene that neither advances nor resolves is filler."
    source: "MP:07_quality_control.md#5"
  bridges:
  - rule: "Give every scene transition one explicit bridge type: shared object, shared color, shared line or path, shared crop, shared word, shared camera direction, or a deliberate hard cut on an audio beat."
    why: "A video with no transition logic feels like a slideshow even when scenes are beautiful."
    source: "MP:04_scene_grammar.md#5"
  - rule: "Carry a designated exit object or property from the previous scene into the next one whenever continuity is wanted."
    why: "A carried element makes the seam invisible."
    source: "MP:04_scene_grammar.md#5"
  - rule: "Use hard cuts sparingly and only when they land on an audio beat or a deliberate reset."
    why: "Random hard cuts are the slideshow failure mode."
    source: "MP:04_scene_grammar.md#5"
  rhythm:
  - rule: "Schedule major semantic beats at roughly 1.5 to 4 seconds depending on complexity and micro-changes inside longer beats every 0.4 to 1.2 seconds."
    why: "Micro-change prevents long beats from stalling."
    source: "MP:04_scene_grammar.md#6"
  - rule: "Make the first visual change happen in under a second and then let the hook state stabilize long enough to be read."
    why: "The opening instant is the highest-stakes beat."
    source: "MP:04_scene_grammar.md#6"
  - rule: "Keep a 15 to 40 second motion piece to a default of about one major semantic beat per few seconds, never forcing a cut every second."
    why: "Continuous transformation feels more premium than a forced cut rate."
    source: "MP:04_scene_grammar.md#6"
  density_wave:
  - rule: "Shape per-scene density with a wave rather than a constant: medium, high, low, medium, high, then a clean payoff."
    why: "Tension that releases and rebuilds supports a strong finish."
    source: "MP:04_scene_grammar.md#7"
  - rule: "Treat a sustained high-high-high-high curve as intentional maximalism only when the style declares it."
    why: "Unrelieved density is exhausting and amateur."
    source: "MP:04_scene_grammar.md#7"
  - rule: "Let a sparse, clean scene follow the densest cluster as a reset moment."
    why: "Contrast between density states is itself a retention tool."
    source: "MP:04_scene_grammar.md#7"
  asset_role_mapping:
  - rule: "Map each asset to exactly one role: evidence proves, metaphor represents a concept, anchor recurs across the video, texture sets atmosphere, label clarifies."
    why: "Role assignment prevents decorative clutter."
    source: "MP:04_scene_grammar.md#8"
  - rule: "Reuse the same anchor object across scenes to build identity."
    why: "Recurring anchors make a piece feel deliberately authored."
    source: "MP:12_content_creation_knowledge.md#9"
  - rule: "Remove any asset that does not carry a role in its scene."
    why: "Every element must earn its render cost."
    source: "MP:04_scene_grammar.md#8"
