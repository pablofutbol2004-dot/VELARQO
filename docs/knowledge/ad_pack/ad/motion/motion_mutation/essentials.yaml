schema_version: "1"
pack: motion_mutation
kind: motion
title: Creative mutation engine
categories:
  dimensions:
  - rule: "Represent every format as dimensions: narrative topology, layout topology, motion topology, asset mix, typography behavior, transition logic, camera model, temporal rhythm, material language, density curve."
    why: "Creativity becomes controlled mutation of a few named dimensions."
    source: "MP:05_creative_mutation_engine.md#1"
  - rule: "Create new formats by mutating one to four dimensions while preserving the others."
    why: "Holding most dimensions fixed is what keeps mutants coherent."
    source: "MP:05_creative_mutation_engine.md#1"
  - rule: "Never ask the generator to be creative in the abstract; always mutate specific dimensions."
    why: "Dimension-targeted mutation is reviewable; open-ended creativity is not."
    source: "MP:01_master_analysis.md#5"
  operators:
  - rule: "Apply layout mutations between named topologies: grid to radial, grid to rail, split-screen to nested cards, flat canvas to 2.5D depth stack, centered to asymmetric editorial."
    why: "Topology swaps change the feel while content stays valid."
    source: "MP:05_creative_mutation_engine.md#2"
  - rule: "Apply motion mutations between behaviors: translate to orbit, wipe to object morph, hard cuts to continuous match moves, card expansion to camera dive."
    why: "Motion is a mutation axis independent of layout."
    source: "MP:05_creative_mutation_engine.md#2"
  - rule: "Mutate asset roles freely: screenshots become cards, cards become physical objects, words become spatial labels, photos become masked textures, icons become nodes."
    why: "Re-roleing assets creates novelty without new assets."
    source: "MP:05_creative_mutation_engine.md#2"
  - rule: "Mutate narrative the same way: linear explanation to mystery reveal, list to accumulation, comparison to transformation, tutorial to challenge and result, case study to diagnosis."
    why: "Narrative mutation preserves value while changing experience."
    source: "MP:05_creative_mutation_engine.md#2"
  - rule: "Mutate temporal and material language deliberately: constant tempo to acceleration, clean vector to scrapbook, glossy tech to newsprint editorial."
    why: "Tempo and material are high-leverage, high-risk axes."
    source: "MP:05_creative_mutation_engine.md#2"
  hybridization:
  - rule: "Hybridize two formats by assigning each a role, for example base grammar F02 progressive diagram with surface grammar F07 scrapbook yields nodes as taped fragments with hand-drawn edges."
    why: "Base plus surface keeps both grammars legible."
    source: "MP:05_creative_mutation_engine.md#3"
  - rule: "State which format supplies the base narrative and which supplies the surface treatment before composing a hybrid."
    why: "An unassigned mix reads as random collage."
    source: "MP:05_creative_mutation_engine.md#3"
  - rule: "Prefer hybrids between a narrative grammar and a material or transition grammar."
    why: "Combining two narrative grammars often doubles the explanation burden."
    source: "MP:05_creative_mutation_engine.md#3"
  novel_format_recipe:
  - rule: "Invent a new format by choosing a semantic goal, one base narrative grammar, one unusual layout topology, one coherent motion topology, a material language, and one signature mechanic."
    why: "Fixed slots force completeness instead of whimsy."
    source: "MP:05_creative_mutation_engine.md#4"
  - rule: "Prototype any novel format as a short five to eight second render before granting it production status."
    why: "Prototyping exposes infeasibility at minimum cost."
    source: "MP:05_creative_mutation_engine.md#4"
  - rule: "Score every novel format on clarity, novelty, and feasibility and keep it only if all three pass."
    why: "A novel format that fails any axis is not production-worthy."
    source: "MP:05_creative_mutation_engine.md#4"
  signature_mechanic:
  - rule: "Give every new format one memorable signature behavior, such as every new idea folding out of the previous one, all information living on an orbit, or cards accumulating into the final shape."
    why: "Without a signature mechanic the output is merely generic motion graphics."
    source: "MP:05_creative_mutation_engine.md#5"
  - rule: "Prefer a signature mechanic that is deterministic to render."
    why: "A memorable and reliable mechanic can be repeated at scale."
    source: "MP:05_creative_mutation_engine.md#5"
  novelty_guardrails:
  - rule: "Reject any mutation that requires more than three unrelated transition styles, changes palette or type system per scene, or moves things with no semantic reason."
    why: "Each is a hard anti-slop violation."
    source: "MP:05_creative_mutation_engine.md#6"
  - rule: "Reject mutations that sacrifice readability or add 3D purely for novelty."
    why: "Novelty must never outrank clarity."
    source: "MP:05_creative_mutation_engine.md#6"
  - rule: "Prefer deterministic motion over generative video whenever the same effect can be rendered in code."
    why: "Deterministic rendering is reliable and repeatable."
    source: "MP:05_creative_mutation_engine.md#6"
  distance_score:
  - rule: "Score a generated format against references on layout, motion topology, material language, narrative structure, and signature mechanic, each on a zero-to-two difference scale."
    why: "A score makes anti-cloning measurable instead of aspirational."
    source: "MP:05_creative_mutation_engine.md#7"
  - rule: "Treat a total distance below five as cloning risk and require at least five of ten while retaining comparable clarity and polish."
    why: "The engine should invent, not reproduce."
    source: "MP:05_creative_mutation_engine.md#7"
  - rule: "Log the distance score with every generated format for later review."
    why: "Scores accumulate into a novelty history."
    source: "MP:05_creative_mutation_engine.md#7"
  creativity_modes:
  - rule: "Expose creativity as discrete modes: conservative mutates one dimension for reliable production, exploratory mutates two to three for format discovery, experimental mutates four or more but requires prototype QC before full generation."
    why: "Modes map directly to operator creativity dials."
    source: "MP:05_creative_mutation_engine.md#8"
  - rule: "Route most production through conservative modes and reserve exploratory and experimental runs for deliberate variation or research."
    why: "Reliability and invention need separate operating modes."
    source: "MP:05_creative_mutation_engine.md#8"
  - rule: "Allow experimental runs only when their output can still pass the same automated QC before release."
    why: "Creativity dials widen the space, never lower the quality bar."
    source: "MP:05_creative_mutation_engine.md#8"
