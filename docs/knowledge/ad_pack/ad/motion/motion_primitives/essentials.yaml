schema_version: "1"
pack: motion_primitives
kind: motion
title: Motion primitive vocabulary
categories:
  transform:
  - rule: "Compose single-object motion from transform primitives (translate_linear, translate_eased, translate_arc, scale_focus, scale_pop, scale_breathe, rotate_snap, rotate_continuous, orbit_anchor)."
    why: "A fixed named vocabulary keeps plans deterministic and renderable."
    source: "MP:03_motion_primitives.md#A"
  - rule: "Add depth with depth_push, depth_pull, and parallax_shift only when a scene calls for layered separation."
    why: "Depth used casually reads as gimmick rather than composition."
    source: "MP:03_motion_primitives.md#A"
  - rule: "Drive frame-level attention with camera_pan, camera_zoom, and camera_orbit_2_5d rather than moving every object at once."
    why: "A camera move preserves object relationships while the view changes."
    source: "MP:03_motion_primitives.md#A"
  group_choreography:
  - rule: "Choreograph card groups with named primitives: fan_out, fan_in, stack, unstack, grid_form, grid_break, rail_form, rail_scroll, radial_form, cluster_attract, cluster_repulse, shuffle, cascade."
    why: "Repeating organizational moves across a set is the F01 mechanic."
    source: "MP:03_motion_primitives.md#B"
  - rule: "Enter and exit groups sequentially with stagger_enter, stagger_exit, or wave_sequence instead of moving all members simultaneously."
    why: "Stagger gives ordered groups readable rhythm."
    source: "MP:03_motion_primitives.md#B"
  - rule: "Parameterize every group primitive with item count, anchor point, spacing, delay function, easing family, depth behavior, and bounded randomization values."
    why: "Declared parameters let the same primitive render across many instances."
    source: "MP:03_motion_primitives.md#B"
  - rule: "Give groups a chosen topology at any moment: rail, grid, fan, radial, stack, or cluster; change topology as a deliberate beat."
    why: "Topology is the variable that makes one collection feel like many."
    source: "MP:03_motion_primitives.md#B"
  reveal:
  - rule: "Reveal masked content with mask_wipe, mask_radial, mask_shape, clip_expand, crop_reveal, or line_draw."
    why: "Masked reveals preserve layout while hiding what is not yet introduced."
    source: "MP:03_motion_primitives.md#C"
  - rule: "Reveal text with type_on, word_build, or character_cascade and reveal imagery with blur_to_focus or scale_from_anchor."
    why: "Text and imagery reveal at different speeds for readability."
    source: "MP:03_motion_primitives.md#C"
  - rule: "Use opacity_fade for quiet entrances and exits only; reserve structural reveals for ideas that deserve them."
    why: "Fades everywhere produce a lifeless fade slideshow."
    source: "MP:03_motion_primitives.md#C"
  transition:
  - rule: "Prefer object-preserving transitions (object_match_move, object_match_scale, object_match_rotate, crop_to_scene, card_to_fullscreen, line_to_next_scene, color_field_bridge)."
    why: "Continuity is preserved because one element carries across the cut."
    source: "MP:03_motion_primitives.md#D"
  - rule: "Reserve scene-replacement transitions (wipe, push, slide, cut_on_motion, flash_cut, hard_cut) for deliberate resets and audio beats."
    why: "Replacement transitions break continuity and should be earned."
    source: "MP:03_motion_primitives.md#D"
  - rule: "Never mix more than one or two transition families in a single video."
    why: "A transition style set is part of the design system."
    source: "MP:07_quality_control.md#hard"
  typography:
  - rule: "Treat text as a physical object: isolate keywords, change scale hierarchy, shift baselines, expand or collapse tracking, replace words, strike through, highlight, and underline-draw."
    why: "Type choreography is the F03 argument mechanic."
    source: "MP:03_motion_primitives.md#E"
  - rule: "Reveal lines by word, mask, or tracking change and keep at most one dominant text event at a time unless deliberately building density."
    why: "Multiple simultaneous text events destroy hierarchy and readability."
    source: "MP:03_motion_primitives.md#E"
  - rule: "Use kinetic counters and rotating labels for numbers and re-identifying units."
    why: "Counting and relabeling communicate change precisely."
    source: "MP:03_motion_primitives.md#E"
  diagram:
  - rule: "Assemble diagrams from nodes and edges: node appear, node connect, edge draw, edge pulse, branch expand and collapse."
    why: "A diagram that physically assembles is the F02 proof-of-systems move."
    source: "MP:03_motion_primitives.md#F"
  - rule: "Highlight the active state and dim the rest (state highlight, state dim) so the eye follows the current idea."
    why: "Focal state changes are cheaper than full re-layout."
    source: "MP:03_motion_primitives.md#F"
  - rule: "Use structural metaphors for quantitative shape: compare columns, progress staircase, funnel compress, orbit relation, before-and-after swap, timeline advance, path trace."
    why: "These encode relationships a viewer can read at a glance."
    source: "MP:03_motion_primitives.md#F"
  ui:
  - rule: "Frame screens inside browser or device chrome (browser/device frame) and drive the narrative with cursor travel, click pulse, selection highlight, and tooltip callout."
    why: "Framing plus cursor action turns a screenshot into a story."
    source: "MP:03_motion_primitives.md#G"
  - rule: "Zoom to the exact control (zoom_to_control) or scroll the window before explaining the change."
    why: "Showing the precise location makes UI instructions actionable."
    source: "MP:03_motion_primitives.md#G"
  - rule: "Reveal panels with card inspect, panel expand, state toggle, and result reveal instead of static screen stills."
    why: "State toggles make before-and-after legible inside one interface."
    source: "MP:03_motion_primitives.md#G"
  collage:
  - rule: "Animate tactile media with paper slide, tape attach, sticker pop, photo drop, image tilt, shadow settle, rip-mask reveal, photocopy jitter, grain flicker, and pinboard accumulation."
    why: "These mimic physical craft that reads as authored."
    source: "MP:03_motion_primitives.md#H"
  - rule: "Keep collage randomization bounded: the same piece should not rotate wildly unless the style explicitly calls for chaos."
    why: "Unbounded randomness breaks the tactile illusion."
    source: "MP:03_motion_primitives.md#H"
  abstract:
  - rule: "Generate abstract motion with concentric expand, radial repeat, blob morph, vector field drift, particle attract and repel, ribbon curl, mesh deform, and torus or orbit motion."
    why: "Named field primitives keep generative-looking motion deterministic."
    source: "MP:03_motion_primitives.md#I"
  - rule: "Add structure with pattern tile, mirrored symmetry, and recursive frame only when the piece needs a geometric system."
    why: "Unstructured particles and 3D are the top fake-complexity tells."
    source: "MP:07_quality_control.md#slop"
  timing:
  - rule: "Use a shared timing vocabulary: hit (2-6 frame emphasis), settle (8-18 frames after motion), hold (readability pause), stagger (sequential delay), anticipation (small opposite pre-move), overshoot (controlled), snap (short high-contrast), drift (slow background)."
    why: "Named timings make pacing reviewable and consistent."
    source: "MP:03_motion_primitives.md#J"
  - rule: "Follow every significant motion with a settle window before the next event starts."
    why: "Settling prevents perpetual motion and lets the eye rest."
    source: "MP:03_motion_primitives.md#J"
  - rule: "Hold text and diagrams long enough to read; never undercut a held state with a new animation."
    why: "Readability beats motion frequency."
    source: "MP:03_motion_primitives.md#J"
  easing:
  - rule: "Choose easing per style family, not per element: crisp editorial (fast-out slow-in, minimal overshoot), playful (spring or elastic with strict bounds), premium (longer ease-in-out, lower acceleration contrast), tech (fast snap plus short settle)."
    why: "Style-level easing families keep motion language coherent."
    source: "MP:03_motion_primitives.md#K"
  - rule: "Select one primary easing family and at most one accent family per format."
    why: "More than two easing voices reads as inconsistent motion."
    source: "MP:03_motion_primitives.md#K"
