schema_version: "1"
pack: motion_qc
kind: motion
title: Motion-graphics quality control
categories:
  hard_rejections:
  - rule: "Reject any render where text is clipped, outside the safe zone, or readable for too little time."
    why: "Unreadable or cut-off text fails the core job of the video."
    source: "MP:07_quality_control.md#hard"
  - rule: "Reject renders where semantic objects overlap unintentionally, fonts or palette change without reason, transition styles are random, or no clear focal object exists."
    why: "Each is a direct incoherence signal."
    source: "MP:07_quality_control.md#hard"
  - rule: "Reject low-resolution assets, mismatched corner radii or strokes, awkward movement starts and stops, excessive simultaneous motion, and decorative assets with no purpose."
    why: "Polish defects are objective even before aesthetic judgment."
    source: "MP:07_quality_control.md#hard"
  - rule: "Reject a transition that disconnects the logic between two scenes."
    why: "Continuity failure is a design bug, not a style choice."
    source: "MP:07_quality_control.md#hard"
  rubric_100:
  - rule: "Score motion output on a 100-point rubric: clarity 25, motion quality 20, composition 15, design-system consistency 15, narrative progression 10, novelty 10, asset quality 5."
    why: "Weighted scores let different failure types trade against each other honestly."
    source: "MP:07_quality_control.md#rubric"
  - rule: "Grade clarity on focal hierarchy, readable text, and whether the concept is understandable."
    why: "Clarity is the largest single quality lever."
    source: "MP:07_quality_control.md#rubric"
  - rule: "Grade motion quality on easing, continuity, timing, and purposeful animation rather than on how much moves."
    why: "Purposeful motion is the difference between design and noise."
    source: "MP:07_quality_control.md#rubric"
  - rule: "Grade narrative progression by whether each beat adds meaning and the payoff resolves the setup."
    why: "Structure is part of quality, not an afterthought."
    source: "MP:07_quality_control.md#rubric"
  production_threshold:
  - rule: "Release a render to production only at a score of at least 82 out of 100 with zero hard rejections."
    why: "The threshold keeps volume high while refusing slop."
    source: "MP:07_quality_control.md#rubric"
  - rule: "When a render fails, record the named blocking reasons rather than only a pass or fail verdict."
    why: "Failure codes tell the generator what to fix."
    source: "MP:07_quality_control.md#scoring"
  - rule: "Keep the QC verdict human in the loop for any subjective dimension until a vision model is proven."
    why: "Automated checks cannot yet judge perceived hierarchy or novelty."
    source: "MP:07_quality_control.md#automated"
  slop_failure_modes:
  - rule: "Treat random creativity as a failure: detect and fix it by enforcing one design system and one signature mechanic per video."
    why: "A new visual idea in every scene is the loudest AI-slop symptom."
    source: "MP:07_quality_control.md#slop"
  - rule: "Treat everything-moves as a failure: designate an attention target and make background elements move less."
    why: "Motion without hierarchy reads as noise."
    source: "MP:07_quality_control.md#slop"
  - rule: "Treat template obviousness as a failure: vary scene topology while preserving the format grammar."
    why: "An identical skeleton repeated endlessly betrays the template."
    source: "MP:07_quality_control.md#slop"
  - rule: "Treat fake complexity as a failure: require every particle, 3D, noise, or glow effect to carry a semantic or stylistic justification."
    why: "Unjustified effects are decoration pretending to be depth."
    source: "MP:07_quality_control.md#slop"
  - rule: "Treat dead-slideshow output as a failure: express information as state changes with object continuity instead of static posters with zoom transitions."
    why: "Slideshow pacing is a design failure, not a rendering detail."
    source: "MP:07_quality_control.md#slop"
  automated_checks:
  - rule: "Run deterministic render QC for text bounds inside the safe area, minimum font size, contrast ratio, overlap detection, and screen time per text element."
    why: "These are measurable before any aesthetic judgment."
    source: "MP:07_quality_control.md#automated"
  - rule: "Run deterministic composition QC for scene density count, palette deviation, typeface count, transition-family count, motion velocity spikes, and empty-frame detection."
    why: "Count-based checks catch incoherence cheaply on every render."
    source: "MP:07_quality_control.md#automated"
  - rule: "Run automated QC on a preview before spending full-resolution render cost."
    why: "Layout and timing failures should be caught at preview scale."
    source: "MP:06_generation_architecture.md#7"
  - rule: "Probe the final file for duration, dimensions, codec, and frame sanity as part of release."
    why: "A corrupt or mis-encoded file must never reach delivery."
    source: "MP:06_generation_architecture.md#7"
