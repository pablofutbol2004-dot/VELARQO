schema_version: "1"
pack: motion_principles
kind: motion
title: Motion-graphics design principles
categories:
  design_constraints:
  - rule: "Give every generated video one visible design system: 1-2 typefaces, a limited palette, one radius, one stroke, one margin system, and one repeated motion behavior."
    why: "Varying these scene by scene is the fastest signal that output is machine-generated rather than designed."
    source: "MP:01_master_analysis.md#2.1"
  - rule: "Keep a stable visual system while the information changes within a piece."
    why: "Consistency lets the viewer read novelty in content instead of noise in styling."
    source: "MP:01_master_analysis.md#1-B"
  - rule: "Enforce one primary focal object, optional secondary support, and background texture at every moment."
    why: "If everything is equally loud the viewer cannot tell what changed; reject such scenes."
    source: "MP:01_master_analysis.md#2.5"
  - rule: "Constrain per-scene object counts rather than letting density float freely."
    why: "High object counts without an intentional scale moment read as clutter."
    source: "MP:04_scene_grammar.md#3"
  - rule: "Design the palette, type system, and shape language once per video, not once per scene."
    why: "A coherent system costs less than fixing inconsistent output later."
    source: "MP:01_master_analysis.md#2.1"
  - rule: "Optimize for clarity times novelty times continuity times polish times production reliability, not peak visual complexity."
    why: "A simple typographic sequence with perfect spacing beats a chaotic scene with twenty effects."
    source: "MP:01_master_analysis.md#7"
  continuity_and_anti_slop:
  - rule: "Transition scenes through a shared object, color, line, crop, word, or camera direction instead of cutting randomly."
    why: "Object continuity is a major anti-slop principle and reads as intentional direction."
    source: "MP:01_master_analysis.md#2.3"
  - rule: "Let an object from scene A become the anchor of scene B where the narrative allows."
    why: "Shared geometry ties adjacent ideas together without a visible cut."
    source: "MP:01_master_analysis.md#2.3"
  - rule: "Extend an existing element (a line, a card, a color field) into the next state rather than spawning unrelated frames."
    why: "Transformation preserves meaning that a hard reset discards."
    source: "MP:01_master_analysis.md#2.3"
  - rule: "Do not change fonts, palette, or transition style between scenes without an explicit design-system reason."
    why: "Unmotivated style drift is the classic AI-slop tell."
    source: "MP:07_quality_control.md#hard"
  - rule: "When a video is composed of one primary format plus one or two secondary mechanics, keep the mix tight."
    why: "Mixing five unrelated aesthetics is weaker than disciplined layering."
    source: "MP:02_format_library.md#composition"
  - rule: "Reject any mutation or design choice that would require more than three unrelated transition styles in one video."
    why: "Transition chaos destroys continuity no matter how good each scene is."
    source: "MP:05_creative_mutation_engine.md#6"
  density_and_rhythm:
  - rule: "Modulate density across a video instead of holding one intensity level."
    why: "Constant maximum stimulation tires the viewer and looks amateurish; contrast resets attention."
    source: "MP:01_master_analysis.md#2.4"
  - rule: "Alternate dense and sparse scenes, motion and pause, macro and detail, text-heavy and visual-heavy beats."
    why: "A clean sparse frame after a dense sequence feels like a reset and aids retention."
    source: "MP:12_content_creation_knowledge.md#8"
  - rule: "Use a default density wave of medium, high, low, medium, high, clean payoff."
    why: "Building and releasing intensity supports a strong ending."
    source: "MP:04_scene_grammar.md#7"
  - rule: "Permit deliberate pauses when visual density is high."
    why: "Pauses let the viewer absorb loaded frames."
    source: "MP:04_scene_grammar.md#6"
  - rule: "Do not force a cut every second; continuous transformation often reads as more premium than a fast slideshow."
    why: "Rhythm comes from modulation, not from maximum cut rate."
    source: "MP:04_scene_grammar.md#6"
  - rule: "Open with a fast first visual change and let the hook state stabilize quickly enough to be read."
    why: "The first moment earns the rest of the video."
    source: "MP:04_scene_grammar.md#6"
  motion_semantics:
  - rule: "Give every motion a semantic purpose: show where something came from, what belongs together, what changed, or what causes what."
    why: "Bad motion simply makes everything move."
    source: "MP:01_master_analysis.md#2.2"
  - rule: "Represent scenes as state transitions (initial state, motion event, final state) rather than animating a finished static poster."
    why: "Motion design is about state change, not moving decoration."
    source: "MP:01_master_analysis.md#3"
  - rule: "When narration moves to a new idea, change the visual state to match."
    why: "If the frame does nothing while the idea advances, attention drops."
    source: "MP:12_content_creation_knowledge.md#6"
  - rule: "Animate the delta between two states, never random drift on top of a finished layout."
    why: "State-driven motion is deterministic and explainable; decorative motion is not."
    source: "MP:01_master_analysis.md#4"
  - rule: "Designate one attention target per scene and move foreground objects more than background objects."
    why: "Foreground-dominates-background motion preserves hierarchy."
    source: "MP:04_scene_grammar.md#3"
  - rule: "Show causality with motion (objects converging, edges drawing, states collapsing) instead of narrating it."
    why: "Visually demonstrated causality lowers cognitive load."
    source: "MP:02_format_library.md#F02"
  - rule: "Use reveal structure as a storytelling tool: setup, partial reveal, relationship, complication, full reveal, takeaway."
    why: "Staged reveals keep the viewer building the model with the video."
    source: "MP:12_content_creation_knowledge.md#2"
  automation_tiers:
  - rule: "Build primarily with tier-1 deterministic capabilities: typography, cards, grids, shape animation, lines, UI framing, screenshots, masks, camera pans and zooms, and collage."
    why: "They are reliable to render and cover most of a short motion-graphics video."
    source: "MP:01_master_analysis.md#6"
  - rule: "Add tier-2 capabilities (2.5D perspective, procedural shapes, bounded particles) only when a format specifically needs them."
    why: "Tier-2 raises render risk without guaranteeing a quality gain."
    source: "MP:01_master_analysis.md#6"
  - rule: "Do not make moving humans or cinematic footage a dependency of generated videos."
    why: "Tier-3 generative content is unreliable and unnecessary for most format families."
    source: "MP:01_master_analysis.md#6"
  - rule: "Prefer authentic assets, screenshots, icons, and procedural shapes before generative images, and generative images before generative video."
    why: "The earlier an asset is in that order, the cheaper and more reliable it is."
    source: "MP:06_generation_architecture.md#5"
  hooks_can_be_visual:
  - rule: "Hook viewers with a purely visual event when words are not yet earned: impossible object choreography, bold geometry, a giant number, or unusual typography."
    why: "Visual hooks stop the scroll without a spoken promise."
    source: "MP:12_content_creation_knowledge.md#7"
  - rule: "Let the visual system advance the idea so the video needs no presenter or talking head."
    why: "Progressive diagrams, type, and object transformation can carry attention alone."
    source: "MP:12_content_creation_knowledge.md#1"
  - rule: "Open by constructing an immediate diagram, card system, or interface in an unexpected framing."
    why: "Recognizable structure appearing fast is itself a hook."
    source: "MP:12_content_creation_knowledge.md#7"
  - rule: "Do not spend the hook on decorative flourishes; reserve full-screen animation and strong moves for thought boundaries and high-importance beats."
    why: "Visual intensity should match narrative importance."
    source: "MP:01_master_analysis.md#1-G"
