schema_version: "1"
pack: motion_formats
kind: motion_format
title: Motion-graphics format families
categories:
  composition_principle:
  - rule: "Treat each format as a reusable grammar of beats and variables, never as a fixed visual template."
    why: "The same grammar must produce hundreds of visibly distinct videos across topics."
    source: "MP:02_format_library.md#intro"
  - rule: "Compose a finished video from one primary format plus one or two secondary mechanics for hooks or evidence."
    why: "Disciplined layering beats mixing five unrelated aesthetics."
    source: "MP:02_format_library.md#composition"
  - rule: "Choose the format from the content job, not from convenience: collections, explanations, tutorials, proofs, and brand stories need different grammars."
    why: "A grammar that cannot carry the job produces weak output no matter how it is rendered."
    source: "MP:02_format_library.md#best-uses"
  F01_kinetic_card_constellation:
  - rule: "Coordinate a collection of cards or images as one object system that fans, rails, grids, stacks, and refocuses on a subset."
    why: "Repeated reorganization of a stable card set is a strong deterministic mechanic."
    source: "MP:02_format_library.md#F01"
  - rule: "Follow the beat grammar: establish scattered objects, introduce a directional force, reorganize into a shape, focus a subset, recombine into the final composition."
    why: "Each beat is a state change the renderer can compute."
    source: "MP:02_format_library.md#F01"
  - rule: "Use F01 for portfolios, example lists, product collections, moodboards, and category-intro hooks."
    why: "Showing many items as one system communicates scale and range."
    source: "MP:02_format_library.md#F01"
  F02_progressive_diagram_explainer:
  - rule: "Build a conceptual diagram one semantic unit at a time so causality and relationships emerge on screen."
    why: "Progressive assembly explains systems without a talking head."
    source: "MP:02_format_library.md#F02"
  - rule: "Follow the beats: claim or problem, node A, node B, connection, counterforce or next stage, zoom out to the whole system, emphasize the takeaway."
    why: "The zoom-out rewards the viewer with the completed model."
    source: "MP:02_format_library.md#F02"
  - rule: "Use F02 for business concepts, economics, education, systems thinking, and case studies."
    why: "It scales to almost any educational topic."
    source: "MP:02_format_library.md#F02"
  F03_kinetic_type_argument:
  - rule: "Make words both language and physical objects: isolate keywords, change their scale and position, and let typography physically demonstrate contrast."
    why: "Type-as-object is cheap to generate and highly controllable."
    source: "MP:02_format_library.md#F03"
  - rule: "Follow the beats: one phrase states the thesis, a keyword separates or emphasizes, typography demonstrates the contrast, add visual punctuation, the next phrase enters by continuation, and the final statement lands with reduced motion."
    why: "Ending with reduced motion gives the payoff gravity."
    source: "MP:02_format_library.md#F03"
  - rule: "Use F03 for arguments, contrasts, bold claims, and messages where the words are the entire show."
    why: "With no imagery required it is the cheapest format to render first."
    source: "MP:02_format_library.md#F03"
  F04_editorial_grid_story:
  - rule: "Animate a rigid editorial layout over time: title establishes the grid, image fills one module, type another, modules reflow, a detail crop becomes the next page, and the brand mark resolves the sequence."
    why: "Grid discipline makes ordinary information feel premium and authored."
    source: "MP:02_format_library.md#F04"
  - rule: "Alternate dense and empty compositions rather than keeping every module filled."
    why: "Editorial contrast between full and sparse modules drives rhythm."
    source: "MP:02_format_library.md#F04"
  - rule: "Use F04 for architecture, fashion, branding, product design, case studies, and portfolios."
    why: "These audiences expect a designed, grid-based voice."
    source: "MP:02_format_library.md#F04"
  F05_product_spec_reveal:
  - rule: "Show minimal product imagery plus isolated specifications with strong whitespace: teaser, feature headline, feature detail, product isolated, comparison or spec, brand end frame."
    why: "Presenting one property at a time with whitespace makes value legible."
    source: "MP:02_format_library.md#F05"
  - rule: "Use F05 for hardware, software launches, premium product reels, and feature announcements."
    why: "A focused reveal suits high-ticket or design-led products."
    source: "MP:02_format_library.md#F05"
  F06_screen_in_scene_tutorial:
  - rule: "Treat screen capture as one visual layer inside a designed composition, framed as a graphic object with callouts guiding attention."
    why: "Framing keeps tutorials from feeling like raw screen recordings."
    source: "MP:02_format_library.md#F06"
  - rule: "Follow the beats: question or hook, app or device appears, cursor or action focus, label explains, result appears, next step or end state."
    why: "The cursor and labels make the action the narrative."
    source: "MP:02_format_library.md#F06"
  - rule: "Use F06 for tutorials, SaaS, AI tools, workflows, and process content."
    why: "It turns software actions into visible proof of method."
    source: "MP:02_format_library.md#F06"
  F07_scrapbook_knowledge_reel:
  - rule: "Make text, images, and cutouts behave like tactile physical media: paper cards, taped evidence, handwritten annotations, overlapping layers, and rip reveals."
    why: "Imperfect tactile media feels designed even when source assets are static."
    source: "MP:02_format_library.md#F07"
  - rule: "Follow the beats: paper or card title, taped or cutout evidence, annotation, an overlap or flip reveals the next idea, collage accumulates, a final object or phrase anchors the end."
    why: "Accumulation builds a physical memory of the argument."
    source: "MP:02_format_library.md#F07"
  - rule: "Use F07 for culture, history, creator education, memory or psychology topics, and personal essays without a talking head."
    why: "Tactile collage suits human and reflective subjects."
    source: "MP:02_format_library.md#F07"
  F08_brand_collage_reel:
  - rule: "Sequence polished visual assets unified by repeated crops, masks, and composition instead of by a narrative."
    why: "A strong frame system makes a montage feel like one designed piece."
    source: "MP:02_format_library.md#F08"
  - rule: "Use F08 for campaigns, art direction, beauty and fashion, and brand mood pieces."
    why: "These audiences want aesthetic coherence over explanation."
    source: "MP:02_format_library.md#F08"
  F09_abstract_geometric_hook:
  - rule: "Let geometric forms transform under a strict color and motion system: singular form, duplication, collision or overlap, morph or rotation, then an unexpected stable composition."
    why: "Discipline inside abstraction is what makes it look intentional."
    source: "MP:02_format_library.md#F09"
  - rule: "Use F09 for bumpers, hooks, transitions, brand identity, and pure motion posts."
    why: "It is a pure-visual attention unit with no literal content."
    source: "MP:02_format_library.md#F09"
  F10_procedural_organic_motion:
  - rule: "Let organic, particle, or field behavior evolve continuously rather than arranging discrete objects."
    why: "Continuous field evolution is its own premium visual language."
    source: "MP:02_format_library.md#F10"
  - rule: "Use F10 for visual music, abstract concepts, tech or art brands, and transition backgrounds."
    why: "Organic fields suit atmosphere more than literal explanation."
    source: "MP:02_format_library.md#F10"
  F11_framed_mixed_media_essay:
  - rule: "Unify video, archival imagery, diagrams, and text with one consistent frame system across the piece."
    why: "The frame system is what stops mixed media from feeling random."
    source: "MP:02_format_library.md#F11"
  - rule: "Follow the beats: thesis, evidence clip, graphic explanation, counterexample, return to evidence, summary."
    why: "Alternating literal evidence and designed explanation sustains argument."
    source: "MP:02_format_library.md#F11"
  F12_timeline_sequence_rail:
  - rule: "Move items along a clear temporal or spatial rail to show history, evolution, or comparison."
    why: "A rail makes sequence legible as physical distance."
    source: "MP:02_format_library.md#F12"
  - rule: "Use F12 for history, evolution, comparisons, from-X-to-Y stories, and product versions."
    why: "Order and progression are the content."
    source: "MP:02_format_library.md#F12"
  F13_app_system_architecture_map:
  - rule: "Represent interface or state changes as modular cards and connections rather than as linear screens."
    why: "System maps communicate structure that a screen-by-screen demo cannot."
    source: "MP:02_format_library.md#F13"
  - rule: "Use F13 for automation systems, funnels, software architecture, and business workflows."
    why: "These topics are best explained as connected systems."
    source: "MP:02_format_library.md#F13"
  F14_single_canvas_visual_metaphor:
  - rule: "Transform metaphors on one canvas instead of cutting to new scenes: a staircase grows, an icon splits, an object changes scale, a path extends, a barrier appears."
    why: "Staying on one canvas keeps the metaphor continuous and readable."
    source: "MP:02_format_library.md#F14"
  - rule: "Use F14 for mindset, educational claims, comparisons, and abstract concepts."
    why: "A living metaphor explains faster than literal narration."
    source: "MP:02_format_library.md#F14"
  F15_data_asset_burst:
  - rule: "Convey scale with large quantities, asset walls, dense grids, and rapid count-up sequences."
    why: "Volume itself is the message for launches and libraries."
    source: "MP:02_format_library.md#F15"
  - rule: "Use F15 for launches, product libraries, milestones, we-generated-X claims, and catalog showcases."
    why: "Counting and massing make output tangible."
    source: "MP:02_format_library.md#F15"
  F16_minimal_split_state_contrast:
  - rule: "Contrast two or more states through a clean split or sequential replacement."
    why: "A pure before-after comparison has almost zero explanation cost."
    source: "MP:02_format_library.md#F16"
  - rule: "Use F16 for old versus new, problem versus solution, expectation versus reality, and before versus after."
    why: "Binary contrast suits content with exactly two poles."
    source: "MP:02_format_library.md#F16"
