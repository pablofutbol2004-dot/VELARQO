schema_version: "1"
pack: motion_architecture
kind: motion
title: Motion-graphics generation architecture
categories:
  pipeline_layers:
  - rule: "Lay out video generation as a pipeline: content plan, narrative beats, format grammar, art direction, scene graph, motion primitives, deterministic render, QC, preview, final export."
    why: "Layered architecture keeps one giant prompt from returning a finished video spec."
    source: "MP:06_generation_architecture.md#arch"
  - rule: "Keep each layer's output a validated intermediate artifact so later layers can be regenerated independently."
    why: "Independent artifacts allow editing without re-prompting the whole video."
    source: "MP:06_generation_architecture.md#4"
  - rule: "Never build a monolithic prompt-to-video agent as the primary mechanism."
    why: "Monoliths hide failure and block deterministic control."
    source: "MP:README.md#recommendation"
  llm_vs_deterministic:
  - rule: "Let AI choose and write: script decomposition, visual metaphors, format family, scene roles, the semantic object graph, novelty mutations, evidence selection, and composition critique."
    why: "Planning and semantics are where language models add value."
    source: "MP:06_generation_architecture.md#1"
  - rule: "Keep code responsible for layout, spacing, timing, interpolation, masks, typography, transitions, layer ordering, safe zones, collision detection, and final rendering."
    why: "Deterministic code is where reliability comes from."
    source: "MP:06_generation_architecture.md#2"
  - rule: "Do not rely on a language model to emit raw frame-by-frame keyframes."
    why: "Hand-keyframing via LLM is slow and non-deterministic."
    source: "MP:06_generation_architecture.md#1"
  renderer_stack:
  - rule: "Prefer a code-driven renderer (Remotion-style React plus SVG, HTML, CSS, or Canvas) for text, cards, UI, screenshots, diagrams, and 2D or light 2.5D motion."
    why: "The primary format families are all within its reach."
    source: "MP:06_generation_architecture.md#3"
  - rule: "Add WebGL or Three.js only for depth-heavy cards, procedural fields, complex particles, and real 3D camera choreography."
    why: "Advanced primitives should not gate the standard pipeline."
    source: "MP:06_generation_architecture.md#3"
  - rule: "Do not make Blender or generative video mandatory for standard reels."
    why: "Mandatory heavy renderers raise cost and failure risk."
    source: "MP:06_generation_architecture.md#3"
  data_model:
  - rule: "Store each video as a project with a content spec, art direction, format spec, scenes, and an audio timeline, plus a QC report."
    why: "A rich stored project supports editing and regeneration."
    source: "MP:06_generation_architecture.md#4"
  - rule: "Give every scene semantic role, objects, relations, initial state, events, final state, and a bridge."
    why: "The scene object model is the unit the renderer executes."
    source: "MP:06_generation_architecture.md#4"
  - rule: "Version the spec schema and fail loudly when a spec does not match it."
    why: "Versioned schemas prevent silent drift between planner and renderer."
    source: "MP:10_implementation_prompt_for_claude.md#schemas"
  asset_policy:
  - rule: "Resolve assets in priority order: existing authentic assets, screenshots and product or UI assets, icons and vectors, procedural shapes, then static image generation, and generative video last."
    why: "Earlier sources are cheaper, more authentic, and more reliable."
    source: "MP:06_generation_architecture.md#5"
  - rule: "Treat screen and UI content as a first-class graphic asset rather than raw footage."
    why: "Framed screens feel designed instead of recorded."
    source: "MP:02_format_library.md#F06"
  - rule: "Never depend on generated moving humans in motion-graphics output."
    why: "Character motion is the least reliable generated asset."
    source: "MP:06_generation_architecture.md#5"
  reusability_grammar_skin_content:
  - rule: "Separate format grammar, brand skin, and content payload so one format can create hundreds of visibly distinct videos."
    why: "Reuse across topics is how scale avoids repetition."
    source: "MP:06_generation_architecture.md#6"
  - rule: "Express brand skin (palette, typefaces, logo, texture, radius, stroke) as data independent of any one format."
    why: "A skin swap restyles an entire library at once."
    source: "MP:06_generation_architecture.md#6"
  - rule: "Keep content payload (topic, words, data, screenshots, examples) separate from how it is shown."
    why: "The same idea can then be produced in many formats and skins."
    source: "MP:06_generation_architecture.md#6"
  preview_then_final:
  - rule: "Render a low-resolution preview, run QC, revise the spec if needed, then render the final high-resolution export."
    why: "Cheap preview catches layout and timing failures before full cost."
    source: "MP:06_generation_architecture.md#7"
  - rule: "Gate the final render on the preview passing automated QC."
    why: "Spending final cost on a failing layout is waste."
    source: "MP:06_generation_architecture.md#7"
  - rule: "Keep preview and final renders deterministic from the same spec and seed."
    why: "Only reproducible renders can be QC'd and re-baselined."
    source: "MP:06_generation_architecture.md#7"
  format_discovery:
  - rule: "Treat format discovery as a separate R and D loop: sample two to three grammars, mutate them, render five to eight second prototypes, rank them, and keep only the winners."
    why: "Prototype-first discovery keeps invention cheap."
    source: "MP:06_generation_architecture.md#8"
  - rule: "Graduate a new format into the production library only after it passes evaluation."
    why: "Production quality is gated by evidence, not enthusiasm."
    source: "MP:06_generation_architecture.md#8"
  - rule: "Test the primitive engine, schemas, deterministic rendering, safe zones, collision detection, format compilation, and mutation reproducibility with a real suite."
    why: "Reliability claims must be backed by tests."
    source: "MP:10_implementation_prompt_for_claude.md#testing"
