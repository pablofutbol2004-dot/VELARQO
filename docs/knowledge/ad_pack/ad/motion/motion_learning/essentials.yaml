schema_version: "1"
pack: motion_learning
kind: motion
title: Motion evaluation and learning
categories:
  log_generation:
  - rule: "Log every generated video with format id and version, mutation operators, topic, duration, asset types, render QC scores, human rating, and platform performance when available."
    why: "Generation history is the raw material for learning."
    source: "MP:09_eval_and_learning_loop.md#1"
  - rule: "Persist the log as structured records tied to the piece and run, not as free text."
    why: "Structured logs can be aggregated and compared."
    source: "MP:09_eval_and_learning_loop.md#1"
  - rule: "Record the creativity mode and every mutation applied to a piece."
    why: "You can only learn which mutations work if they are attributable."
    source: "MP:09_eval_and_learning_loop.md#6"
  craft_vs_topic:
  - rule: "Separate craft performance from topic performance: a reel can win on topic, hook, distribution, format, timing, or audience fit."
    why: "One viral result does not prove the visual format is strong."
    source: "MP:09_eval_and_learning_loop.md#2"
  - rule: "Compare a visual format across multiple topics and instances before judging it."
    why: "Cross-topic evidence isolates format value from topic luck."
    source: "MP:09_eval_and_learning_loop.md#2"
  - rule: "Never auto-conclude a causal winner from a single high-performing video."
    why: "Confounds are too many to trust a single sample."
    source: "MP:09_eval_and_learning_loop.md#2"
  component_metrics:
  - rule: "Track component metrics where available: hook retention, average watch percentage, completion rate, rewatches, saves and shares, and clicks or DMs."
    why: "Component metrics attribute attention to the piece structure."
    source: "MP:09_eval_and_learning_loop.md#3"
  - rule: "Map results back to hook grammar, format family, scene count, density curve, visual style, and signature mechanic."
    why: "Learning accrues to the design components, not the whole video."
    source: "MP:09_eval_and_learning_loop.md#3"
  - rule: "Measure business-relevant actions (leads, DMs, profile visits) separately from raw views when judging a reel for a business."
    why: "Propagation and conversion are different goals."
    source: "MP:09_eval_and_learning_loop.md#3"
  human_review_labels:
  - rule: "Ask human reviewers to label rendered videos with a fixed vocabulary: polished, clear, fresh, overdesigned, generic, confusing, too fast, too slow, AI-looking, excellent transition, weak typography."
    why: "A fixed label set turns verdicts into training and eval data."
    source: "MP:09_eval_and_learning_loop.md#4"
  - rule: "Store human labels against the exact spec and mutation that produced the render."
    why: "Labels only teach if they are attributable."
    source: "MP:09_eval_and_learning_loop.md#4"
  - rule: "Prefer a short label checklist over a free-text rating for reviewer speed and comparability."
    why: "Compact structured feedback scales to many renders."
    source: "MP:09_eval_and_learning_loop.md#4"
  format_promotion_lifecycle:
  - rule: "Move formats through a promotion lifecycle: experimental, candidate, production, proven, deprecated."
    why: "Lifecycle prevents untested formats from flooding production."
    source: "MP:09_eval_and_learning_loop.md#5"
  - rule: "Promote a format to production-ready only after several successful renders, a low QC failure rate, consistent human approval, and manageable render cost."
    why: "Reliability is earned, not declared."
    source: "MP:09_eval_and_learning_loop.md#5"
  - rule: "Deprecate formats that no longer pass QC or approval even if they were once proven."
    why: "Formats decay as taste and platform mechanics change."
    source: "MP:09_eval_and_learning_loop.md#5"
  compatibility_matrix:
  - rule: "Track which mutation combinations stay coherent, for example progressive-diagram plus scrapbook material works while the same grammar plus aggressive 3D camera plus tiny labels fails."
    why: "Compatibility knowledge beats generic prompt tuning."
    source: "MP:09_eval_and_learning_loop.md#6"
  - rule: "Build an accumulating compatibility matrix between format families, material languages, motion families, and content types."
    why: "The matrix encodes hard-won combination experience."
    source: "MP:09_eval_and_learning_loop.md#6"
  - rule: "Let the compatibility matrix guide which hybrids a creativity mode may propose."
    why: "Proven combinations lower risk for exploratory runs."
    source: "MP:09_eval_and_learning_loop.md#6"
