schema_version: "1"
pack: carousel_qc
kind: carousel
title: Carousel QC rubric and failure modes
categories:
  scoring:
  - rule: "Score each QC category 0 to 5 and ship only when no category is below 3, the average is at least 3.7, and cover, sequence, hierarchy, and evidence are at least 4 where relevant."
    why: "A pass needs both the floor and the weighted core."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#scoring"
  gates:
  - rule: "Run a structural gate before human review: clear viewer change, archetype selected, complete slide roles, slide two validates the cover, zero redundant slides, and a payoff in the sequence."
    why: "Sequence logic must exist before any rendering."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fast"
  - rule: "Run a visual gate: invariants defined, every slide has a focal point, every visual has a function, the cover passes the feed-size test, and the contact sheet rhythm holds."
    why: "Individual slides can pass while the sequence fails."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fast"
  - rule: "Run a truth gate: zero unsupported claims and zero fabricated proof, and an originality gate against recent templates."
    why: "Beauty must never launder fake authority."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fast"
  reject_when:
  - rule: "Reject a cover whose title needs a paragraph, that has too many focal points, that baits more than it pays, or where tiny decorative text carries the meaning."
    why: "The cover must read at feed size and represent the payoff."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#2"
  - rule: "Reject a slide two that repeats the cover, contains filler, or delays the point again."
    why: "Promise collapse happens the moment slide two fails to validate."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#3"
  - rule: "Reject sequences where slides are different phrasings of one idea, order is arbitrary when order matters, or the payoff is abrupt."
    why: "State change, not rephrasing, is progression."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#4"
  - rule: "Reject slides that rely on unexplained pronouns, meaningless headlines outside context, or act as connective tissue with no value."
    why: "Local completeness keeps each slide worth seeing alone."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#6"
  - rule: "Reject text walls from failure to edit, tiny type used to fit content, and sparse motivational filler."
    why: "Density must suit the role, not hide weakness."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#7"
  - rule: "Reject slides where headline, image, labels, and icons compete, or where important text is visually weaker than decoration."
    why: "Reading order must never depend on guessing."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#8"
  - rule: "Reject typography where styles fight, a decorative font carries body copy, everything is bold, or microcopy holds the central idea."
    why: "Emphasis must be purposeful and selective."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#9"
  - rule: "Reject spacing that is almost aligned, slides crowded despite modest content, or margins that drift between slides."
    why: "Consistent small spacing scale is the calm maker."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#10"
  - rule: "Reject visual elements with no job, icons used to fill space, diagrams that add complexity without clarifying relationships, and decorative effects that hurt readability."
    why: "Every non-text element performs a function or leaves."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#11"
  - rule: "Reject sequences where every slide looks like a different template pack or brand colors and type change without reason."
    why: "Three to six invariants must stay visible."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#12"
  - rule: "Reject output that is a reskin: swapping the title and image would turn it into any other post, or AI aesthetic effects dominate topic thinking."
    why: "The anti-template test keeps content specific."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#19"
  - rule: "Generate a contact sheet and reject flat rhythm, density clusters, repeated silhouettes, color imbalance, a weak closer, or a cover that is not distinct."
    why: "A sequence can pass slide QC and still fail the sheet test."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#20"
  failure_modes:
  - rule: "Fix pretty-slideshow output by defining slide roles and a sequence engine before rendering."
    why: "Beautiful independent panels are not a carousel."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
  - rule: "Fix generic-AI-wisdom output by requiring a mechanism, example, or evidence for every nontrivial teaching claim."
    why: "Strong design around vague advice is still weak."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
  - rule: "Reject the repeated minimal-center-stack pattern (centered heading plus tiny body plus icon) on every slide by varying layout according to information geometry."
    why: "It is the loudest AI-template signature."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
  - rule: "Fix dead repetition by planning rhythm; fix random creativity by choosing invariants first."
    why: "Consistency without repetition is the goal."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
  - rule: "Fix hook-payoff mismatch with slide-two validation, and fix weak endings by adding synthesis, callback, or a natural CTA."
    why: "Covers can out-promise, and sequences can just stop."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
  - rule: "Fix forced-education image carousels by classifying content mode first and not forcing copy everywhere."
    why: "Text is not mandatory on every slide."
    source: "CP:QC_RUBRIC_AND_FAILURE_MODES.md#fail"
