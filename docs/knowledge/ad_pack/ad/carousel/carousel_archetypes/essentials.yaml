schema_version: "1"
pack: carousel_archetypes
kind: carousel
title: Carousel archetypes and sequence blueprints
categories:
  choosing:
  - rule: "Choose an archetype from the content objective, never from the easiest layout: change a belief, teach a method, show a process, correct behavior, give reference value, explain evidence, build a story, teach by examples, showcase taste, bond identity, or win local leads."
    why: "The archetype is architecture; the design is variable."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#choosing"
  archetype_map:
  - rule: "Contrarian reframe essay: contrarian claim, clarify the mistaken frame, consequence of the old frame, mechanism, new frame, example or proof, application, compressed quotable conclusion."
    why: "Change a belief by removing one objection per slide."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#1"
  - rule: "Framework or system breakdown: name the system, the problem it solves, map its components, one component per slide, then synthesis and a next action."
    why: "Structured incompleteness makes the viewer wait for the remaining parts."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#2"
  - rule: "Tutorial or process: outcome cover, starting state, numbered steps, result or transformation, optional shortcut or mistake, save or CTA."
    why: "Visible progress toward a finished result drives continuation."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#3"
  - rule: "Do or don't contrast: repeated bad-versus-good pairs, or split-panel slides with bad behavior, consequence, better behavior, and a short rationale."
    why: "Comparison gives immediate clarity and anticipation of the next error."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#4"
  - rule: "Mistakes or diagnostic list: specific mistake promise, each mistake with consequence and correction, then the pattern behind them and a simple diagnostic checklist."
    why: "Self-diagnosis makes the viewer wonder whether they commit the next one."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#5"
  - rule: "Reference library or cheat sheet: number-plus-category promise, one consistently structured reference unit per slide (name, definition, when to use, example, limitation), then a selection rule."
    why: "Collection completion and reference value sustain the swipe."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#6"
  - rule: "Evidence or research explainer: surprising conclusion, what was studied, main result, comparison, caveat, application, conclusion."
    why: "Evidence accumulation is the engine, and claims must stay tied to real sources."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#7"
  - rule: "Story or case narrative: hook or paradox, context, inciting event, complication, turning point, result, meaning, connection to the audience."
    why: "An unresolved outcome plus state change is the continuation engine."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#8"
  - rule: "Example roundup or teardown: category promise, selection criterion, example cards with what works and mechanism, cross-example pattern, viewer question."
    why: "Curiosity about the next example plus comparative learning."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#9"
  - rule: "Visual portfolio or mood sequence: build a visual sequence curve (hero, scale change, detail, context, texture, contrast, resolution) instead of adding explanatory copy."
    why: "For image-led content the visuals are the value; do not force education onto them."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#10"
  - rule: "Identity or relatable statements: identity statement, then specific recognized moments, tensions, or beliefs of the audience, then resolution or reinforcement."
    why: "Recognition of this-is-my-world bonds the audience."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#11"
  - rule: "Problem to solution for local business: pains, diagnostic mistakes, then service relevance; keep educational or entertaining value ahead of conversion and never make every slide an ad."
    why: "Recognition of the real pain proves the business understands it."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#12"
  sequence_primitives:
  - rule: "Recombine archetypes from sequence primitives: open loop, escalation, contrast, enumeration, reveal, example, proof, compression, callback, and CTA bridge."
    why: "Primitives let archetypes be mixed into coherent new formats."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#primitives"
  - rule: "Use open loops sparingly; escalation, proof, and callback build design-quality progression without cliffhanger fatigue."
    why: "If every slide withholds, the carousel feels manipulative."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#primitives"
  - rule: "Close with a callback or compression (recall an earlier phrase, image, or diagram) so the ending feels designed rather than merely stopped."
    why: "Callbacks make a sequence feel authored end to end."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#primitives"
  hybrids:
  - rule: "Hybridize compatible archetypes for novel formats: research with story, teardown with tutorial, portfolio with essay, mistakes with case study, reference library with decision tree."
    why: "Hybridization is the primary route to new formats without arbitrary weirdness."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#hybrids"
  failure_modes:
  - rule: "Reject an archetype execution that repeats its hook for the whole length without mechanism, evidence, or new state."
    why: "Reframe essays fail when the claim is just restated."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#failure"
  - rule: "Reject frameworks that rename obvious advice, tutorials without enough visual evidence to replicate, do-don't that moralizes without mechanism, and moodboard roundups with no analysis."
    why: "Each is the archetype's characteristic hollow output."
    source: "CP:ARCHETYPES_AND_SEQUENCE_BLUEPRINTS.md#failure"
