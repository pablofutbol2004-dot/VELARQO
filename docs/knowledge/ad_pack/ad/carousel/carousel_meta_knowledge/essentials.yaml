schema_version: "1"
pack: carousel_meta_knowledge
kind: carousel
title: Meta-knowledge extracted from the carousels
categories:
  business_job:
  - rule: "Give every content asset a business job (attract, position, prove, educate, qualify, convert, retain) and judge it against that job, not against generic reach."
    why: "Content without a stated job cannot be measured or iterated. Confidence: strong synthesis."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#1.3"
  - rule: "Plan content as a combinatorial matrix rather than a queue of one-off posts."
    why: "Crossing angles with formats and offers exposes coverage gaps and reuse. Confidence: useful principle."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#1.1"
  - rule: "Research winning ideas in the niche before inventing from zero, but treat research as evidence to synthesize, never as a list to copy."
    why: "Reuse what the audience already rewards, then go beyond it. Confidence: useful principle with caveats."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#1.2"
  hooks_and_attention:
  - rule: "Treat the hook as the total perceptual event (visual plus words plus situation), not only the first sentence."
    why: "What stops the scroll is recognition and contrast, not copy alone. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#2.1"
  - rule: "Prefer hook families over hook templates so wording is regenerated for each topic."
    why: "Families stay fresh; memorized phrasings go stale fast. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#2.2"
  - rule: "Frame outcomes one degree away from the viewer's current state rather than as a distant fantasy."
    why: "Proximal, plausible outcomes feel actionable. Confidence: strong with caveats."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#2.3"
  storytelling:
  - rule: "Story content works when it is intentional: a chosen before-state, a shift, an after-state, and a meaning, not a diary recap."
    why: "The shift is the story, not the event. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#3.1"
  - rule: "Introduce novelty by changing information (new angle, new evidence, new application) rather than by restyling the same claim."
    why: "Information novelty compounds value; stylistic novelty alone is decoration. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#3.2"
  - rule: "Design emotion through visual decisions: scale, color, crop, pacing, and subject signal feeling before any words are read."
    why: "Emotion can be composed, not only narrated. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#3.3"
  voice_and_brand:
  - rule: "Separate voice (who you are), tone (how you modulate for context), and manner of speaking; a brand voice stays stable while tone flexes."
    why: "Defined layers let expression adapt without losing identity. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#4.1"
  - rule: "Hold brand coherence as interacting pillars (voice, visual, message, behavior) instead of one slogan or palette."
    why: "Coherence is the system, not the artifact. Confidence: useful synthesis."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#4.2"
  - rule: "Earn recognition through repetition of distinctive elements, not constant novelty."
    why: "Recurring signals build recall; relentless novelty defeats it. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#4.3"
  - rule: "Treat the brand as kept promises: every claim in content is a promise the product or service must honor."
    why: "Promises kept are identity; promises broken are liability. Confidence: strong with caveats."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#4.4"
  positioning:
  - rule: "For service businesses, lead with the destination or outcome the customer wants, not the internal process."
    why: "Viewers buy results, not workflow descriptions. Confidence: strong with nuance."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#5.1"
  - rule: "Treat not-every-client-is-a-good-fit as a positioning strength, not just a sales filter."
    why: "Clear fit makes the right audience self-identify. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#5.2"
  authority:
  - rule: "Build authority through concrete specificity and evidence, not through performance or status signaling."
    why: "Specifics are checkable; performance without proof is noise. Confidence: strong."
    source: "CP:META_KNOWLEDGE_EXTRACTED.md#6.1"
